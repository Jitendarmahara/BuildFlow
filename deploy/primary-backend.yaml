apiVersion: apps/v1
kind: Deployment
metadata: { name: primary-backend, namespace: lovable-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: primary-backend } }
  template:
    metadata: { labels: { app: primary-backend } }
    spec:
      containers:
        - name: primary-backend
          image: ${IMAGE_REGISTRY}/lovable-primary-backend:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            # orchestrator Service is in the same namespace → short name resolves
            - { name: ORCHESTRATOR_URL, value: "http://orchestrator:5000" }
            # used by GET /internal/allow-tls (Caddy on-demand TLS guard) to decide which
            # hostnames we'll mint certs for
            - { name: PUBLIC_DOMAIN, value: "${DOMAIN}" }
          envFrom:
            # DATABASE_URL + AWS_* + JWT_SECRET
            - secretRef: { name: backend-secrets }
---
apiVersion: v1
kind: Service
metadata: { name: primary-backend, namespace: lovable-system }
spec:
  selector: { app: primary-backend }
  ports: [{ port: 3000, targetPort: 3000 }]
