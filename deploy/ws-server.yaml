apiVersion: apps/v1
kind: Deployment
metadata: { name: ws-server, namespace: lovable-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: ws-server } }
  template:
    metadata: { labels: { app: ws-server } }
    spec:
      containers:
        - name: ws-server
          image: docker.io/library/lovable-ws-server:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4042 }]
---
apiVersion: v1
kind: Service
metadata: { name: ws-server, namespace: lovable-system }
spec:
  # name MUST be "ws-server" in lovable-system → matches the agent's
  # WS_SERVER_URL=ws://ws-server.lovable-system.svc.cluster.local:4042
  selector: { app: ws-server }
  ports: [{ port: 4042, targetPort: 4042 }]
