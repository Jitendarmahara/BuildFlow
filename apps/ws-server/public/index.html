<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>agent live</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      background: #0d1117; color: #e6edf3; height: 100vh;
      display: grid; grid-template-columns: 320px 1fr; grid-template-rows: 1fr auto;
    }
    #plan { grid-row: 1 / 3; border-right: 1px solid #21262d; padding: 16px; overflow-y: auto; }
    #plan h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #7d8590; margin: 0 0 12px; }
    .task { display: flex; gap: 8px; padding: 6px 0; align-items: flex-start; }
    .task .box { width: 16px; flex: none; }
    .task.pending .box::before     { content: "○"; color: #7d8590; }
    .task.in_progress .box::before { content: "◐"; color: #d29922; }
    .task.done .box::before        { content: "●"; color: #3fb950; }
    .task.done .desc { color: #7d8590; text-decoration: line-through; }
    #main { overflow-y: auto; padding: 16px; }
    .row { padding: 3px 0; white-space: pre-wrap; word-break: break-word; }
    .tool { color: #58a6ff; }
    .result { color: #7d8590; padding-left: 16px; }
    .result.err { color: #f85149; }
    .verify { color: #d29922; }
    .question { margin: 8px 0; padding: 10px 12px; border: 1px solid #d29922; border-radius: 6px; }
    .question .opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .question button { background: #21262d; border: 1px solid #30363d; color: #e6edf3; padding: 6px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
    .question button:hover:not(:disabled) { border-color: #d29922; }
    .question input { margin-top: 8px; width: 100%; background: #010409; border: 1px solid #30363d; color: #e6edf3; padding: 8px 10px; border-radius: 6px; font: inherit; }
    .question :disabled { opacity: .5; cursor: default; }
    #assistant { color: #e6edf3; }
    .done-banner { color: #3fb950; padding: 8px 0; border-top: 1px solid #21262d; margin-top: 8px; }
    #status { position: fixed; top: 8px; right: 12px; font-size: 11px; color: #7d8590; }
    #composer { grid-column: 2; display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #21262d; }
    #composer input {
      flex: 1; background: #010409; border: 1px solid #30363d; color: #e6edf3;
      padding: 8px 12px; border-radius: 6px; font: inherit; outline: none;
    }
    #composer input:focus { border-color: #58a6ff; }
    #composer button {
      background: #238636; border: none; color: #fff; padding: 8px 16px;
      border-radius: 6px; font: inherit; cursor: pointer;
    }
    #composer button:disabled { background: #21262d; color: #7d8590; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="status">connecting…</div>

  <div id="plan">
    <h2>Plan</h2>
    <div id="tasks"></div>
  </div>

  <div id="main"></div>

  <form id="composer">
    <input id="input" placeholder="Ask for a change…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    const projectId = new URLSearchParams(location.search).get("projectId") ?? "local-test";
    const status = document.getElementById("status");
    const main = document.getElementById("main");
    const tasksEl = document.getElementById("tasks");
    const composer = document.getElementById("composer");
    const input = document.getElementById("input");

    // --- plan state (folded live from create_plan / update_task_status) ---
    let tasks = [];
    function renderPlan() {
      tasksEl.innerHTML = "";
      for (const t of tasks) {
        const el = document.createElement("div");
        el.className = "task " + t.status;
        el.innerHTML = `<span class="box"></span><span class="desc"></span>`;
        el.querySelector(".desc").textContent = t.description;
        tasksEl.appendChild(el);
      }
    }

    // --- main log helpers ---
    function line(text, cls) {
      const el = document.createElement("div");
      el.className = "row " + (cls ?? "");
      el.textContent = text;
      main.appendChild(el);
      main.scrollTop = main.scrollHeight;
      return el;
    }

    // the current streaming assistant bubble (tokens append here)
    let bubble = null;
    function appendToken(text) {
      if (!bubble) { bubble = line("", "row"); bubble.id = "assistant"; }
      bubble.textContent += text;
      main.scrollTop = main.scrollHeight;
    }
    function endBubble() { bubble = null; }

    const toolLabel = {
      write_file: "✏️  write", run_command: "⚙️  run",
      rename_file: "↪️  rename", delete_file: "🗑️  delete",
    };

    function handle(ev) {
      switch (ev.type) {
        case "token":
          appendToken(ev.text);
          break;

        case "assistant":
          endBubble();
          if (ev.content) line(ev.content);
          break;

        case "tool_call": {
          endBubble();
          if (ev.name === "create_plan") {
            tasks = (ev.args?.tasks ?? []).map((t) => ({ ...t, status: "pending" }));
            renderPlan();
          } else if (ev.name === "update_task_status") {
            const t = tasks.find((x) => x.id === ev.args?.taskId);
            if (t && ev.args?.status) { t.status = ev.args.status; renderPlan(); }
          } else {
            const target = ev.args?.path ?? ev.args?.to ?? ev.args?.command ?? "";
            line(`${toolLabel[ev.name] ?? ev.name}  ${target}`, "tool");
          }
          break;
        }

        case "tool_result": {
          const ok = ev.result?.ok !== false;
          if (!ok) line(`✗ ${ev.name}: ${JSON.stringify(ev.result)}`, "result err");
          break;
        }

        case "verify":
          endBubble();
          line(`🔧 build failed — fixing (attempt ${ev.attempt})`, "verify");
          break;

        case "question":
          renderQuestion(ev);
          break;

        case "done":
          endBubble();
          line(`✓ done${ev.text ? " — " + ev.text : ""}`, "done-banner");
          break;
      }
    }

    // render a question from the agent: option buttons or a text input; the answer goes back up
    function renderQuestion(ev) {
      endBubble();
      const box = document.createElement("div");
      box.className = "question";
      const q = document.createElement("div");
      q.textContent = "❓ " + ev.question;
      box.appendChild(q);
      const send = (content) => {
        if (ws && ws.readyState === WebSocket.OPEN)
          ws.send(JSON.stringify({ type: "answer", id: ev.id, content }));
        box.querySelectorAll("button, input").forEach((el) => (el.disabled = true));
        line(`↳ ${content}`, "tool");
      };
      if (Array.isArray(ev.options) && ev.options.length) {
        const row = document.createElement("div");
        row.className = "opts";
        for (const opt of ev.options) {
          const b = document.createElement("button");
          b.type = "button";
          b.textContent = opt;
          b.onclick = () => send(opt);
          row.appendChild(b);
        }
        box.appendChild(row);
      } else {
        const inp = document.createElement("input");
        inp.placeholder = "Type your answer, press Enter…";
        inp.onkeydown = (e) => { if (e.key === "Enter" && inp.value.trim()) send(inp.value.trim()); };
        box.appendChild(inp);
      }
      main.appendChild(box);
      main.scrollTop = main.scrollHeight;
      box.querySelector("input, button")?.focus();
    }

    // --- connect ---
    let ws;
    function connect() {
      ws = new WebSocket(`ws://${location.host}/subscribe?projectId=${projectId}`);
      ws.onopen = () => { status.textContent = "● live"; status.style.color = "#3fb950"; };
      ws.onclose = () => {
        status.textContent = "○ disconnected — retrying";
        status.style.color = "#f85149";
        setTimeout(connect, 1500);
      };
      ws.onmessage = (e) => {
        let ev; try { ev = JSON.parse(e.data); } catch { return; }
        handle(ev);
      };

      composer.onsubmit = (e) => {
        e.preventDefault();
        const content = input.value.trim();
        if (!content || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({ type: "user_message", content }));
        line(`› ${content}`, "tool");
        input.value = "";
      };
    }
    connect();
  </script>
</body>
</html>
